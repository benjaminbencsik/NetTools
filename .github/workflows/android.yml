name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Build a preview or publish a signed production release
        type: choice
        options: [preview, release]
        default: preview
      version:
        description: Production version (for example 0.1.0)
        type: string
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NETTOOLS_VERSION_CODE: ${{ github.run_number }}
      NETTOOLS_VERSION_NAME: ${{ inputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore preview signing identity
        if: inputs.channel != 'release'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nettools-preview-signing-v1
      - name: Test core diagnostics
        run: bash scripts/test-core.sh
      - name: Build and lint preview
        if: inputs.channel != 'release'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NetTools-preview.apk
      - name: Build signed release
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.NETTOOLS_KEYSTORE_BASE64 }}
          NETTOOLS_STORE_PASSWORD: ${{ secrets.NETTOOLS_STORE_PASSWORD }}
          NETTOOLS_KEY_ALIAS: ${{ secrets.NETTOOLS_KEY_ALIAS }}
          NETTOOLS_KEY_PASSWORD: ${{ secrets.NETTOOLS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$NETTOOLS_STORE_PASSWORD" || -z "$NETTOOLS_KEY_ALIAS" || -z "$NETTOOLS_KEY_PASSWORD" ]]; then
            echo 'Add the four NETTOOLS signing secrets described in README.md before publishing a release.'
            exit 1
          fi
          export NETTOOLS_KEYSTORE_PATH="$RUNNER_TEMP/nettools-release.jks"
          trap 'rm -f "$NETTOOLS_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NETTOOLS_KEYSTORE_PATH"
          chmod 600 "$NETTOOLS_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NetTools.apk
      - name: Verify APK signature and checksums
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTools-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download preview
        if: github.event_name != 'pull_request' && inputs.channel != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          First version of NetTools for Android 8.0 and newer.

          Download **NetTools-preview.apk** below and open it on your Android phone. If prompted, allow APK installation for the browser or file manager used to open this file. Google Play is not needed.

          Includes ping, DNS address lookup, TCP port checks, HTTP headers, TLS certificate checks, an IPv4 subnet calculator, network details, and local history with copy/share.

          This is a debug-signed preview for testing, with its own application ID. The preview signing key is cached between builds, but GitHub can evict that cache; an incompatible future preview may require reinstalling and will then lose local history. Production releases require the private signing secrets in the README and install as a separate app. No purchases or ads are enabled in this preview.
          NOTES
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "preview-$GITHUB_RUN_NUMBER" dist/* --target "$GITHUB_SHA" --prerelease --title "NetTools 0.1.0 Preview $GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish signed production release
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$NETTOOLS_VERSION_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version such as 0.1.0.'
            exit 1
          fi
          printf 'Download NetTools.apk below for Android 8.0+. No Google Play installation is required.\n\nSource commit: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "NetTools $version" --notes-file "$RUNNER_TEMP/release-notes.md"
